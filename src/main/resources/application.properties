spring.application.name=search-image

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Server port configuration (Render / Docker / EC2)
server.port=${PORT:8080}

# CORS configuration with fallback
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:${ALLOWED_ORIGIN:http://localhost:5173,http://localhost:3000}}
